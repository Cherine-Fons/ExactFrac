[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "exactfrac"
version = "0.1.0.dev0"
description = "Exact certificate-producing algorithms for compact-multiplicity modified set-pair density."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.12",
]

[tool.setuptools.packages.find]
where = ["."]
include = [
    "exactfrac",
    "exactfrac.*",
    "exactfrac_verify",
    "exactfrac_verify.*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "-ra",
    "--strict-config",
    "--strict-markers",
]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [
    ".venv",
    "artifacts",
]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
    "SIM",
    "RUF",
]
